[project]
name = "tarot-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "bcrypt>=5.0.0",
    "chromadb>=1.5.5",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "fastmcp>=3.0.2",
    "google-genai>=1.0.0",
    "groq>=1.1.1",
    "mcp[cli]>=1.26.0",
    "openai>=2.24.0",
    "pytz>=2026.1.post1",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.47",
    "stytch>=14.2.0",
    "uvicorn>=0.41.0",
    "torch",
    "torchvision",
    "torchaudio",
    "mysql-connector-python>=9.6.0",
    "edge-tts>=7.2.0",
    "unicorn>=2.1.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
